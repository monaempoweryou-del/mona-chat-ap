name: Pages Diagnose

on:
  workflow_dispatch:
  push:
    branches:
      - claude/code-review-1zskrw
    paths:
      - .github/workflows/pages-diagnose.yml

permissions:
  pages: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query leads and revision requests
        run: |
          HTML=$(curl -sS https://unveiled.pro/dashboard/)
          SB_URL=$(echo "$HTML" | grep -oE "https://[a-z0-9]+\.supabase\.co" | head -1)
          SB_KEY=$(echo "$HTML" | grep -oE "(sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_.-]{40,})" | head -1)
          echo "== Recent leads (all columns, latest 3) =="
          curl -sS "$SB_URL/rest/v1/leads?select=*&order=created_at.desc&limit=3" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" | python3 -c "
          import json,sys
          rows=json.load(sys.stdin)
          for r in rows:
              for k,v in r.items():
                  v=str(v)
                  print(f'  {k}: {v[:160]}')
              print('  ---')
          " || true
          echo ""
          echo "== Recent revision_requests =="
          curl -sS "$SB_URL/rest/v1/revision_requests?select=*&order=created_at.desc&limit=4" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" | python3 -m json.tool | head -80 || true
