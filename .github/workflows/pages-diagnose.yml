name: Pages Diagnose

on:
  workflow_dispatch:
  push:
    branches:
      - claude/code-review-1zskrw
    paths:
      - .github/workflows/pages-diagnose.yml

permissions:
  pages: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect unveiled.pro content
        run: |
          echo "== Response headers for https://unveiled.pro/ =="
          curl -sSI https://unveiled.pro/ || true
          echo ""
          echo "== First 300 lines of HTML at root =="
          curl -sS https://unveiled.pro/ | head -300 || true
          echo ""
          echo "== Probe candidate paths =="
          for p in platinum-pool platinum-pool/ sites leads app dashboard goldsmith goldsmith-financial demo sites/platinum-pool 404.html; do
            curl -sS -o /dev/null -w "https://unveiled.pro/$p -> HTTP %{http_code} (final: %{url_effective})\n" -L "https://unveiled.pro/$p" || true
          done
          echo ""
          echo "== www redirect target =="
          curl -sSI https://www.unveiled.pro/ | grep -i location || true
