name: Pages Diagnose

on:
  workflow_dispatch:
  push:
    branches:
      - claude/code-review-1zskrw
    paths:
      - .github/workflows/pages-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Find the repo serving unveiled.pro
        run: |
          echo "== Public repos for monaempoweryou-del (name, has_pages, pushed_at) =="
          curl -sS "https://api.github.com/users/monaempoweryou-del/repos?per_page=100&sort=pushed" \
            | python3 -c "
          import json,sys
          for r in json.load(sys.stdin):
              print(f\"  {r['name']:40s} pages={r['has_pages']} pushed={r['pushed_at']} private={r['private']}\")
          " || true
