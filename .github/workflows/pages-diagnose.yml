name: Pages Diagnose

on:
  workflow_dispatch:
  push:
    branches:
      - claude/code-review-1zskrw
    paths:
      - .github/workflows/pages-diagnose.yml

permissions:
  pages: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect dashboard app to find lead-site source
        run: |
          echo "== /dashboard/ HTML (script/link/api references) =="
          curl -sS https://unveiled.pro/dashboard/ | grep -oE '(src|href)="[^"]+"' | sort -u | head -40 || true
          echo ""
          echo "== /app/ HTML (script/link/api references) =="
          curl -sS https://unveiled.pro/app/ | grep -oE '(src|href)="[^"]+"' | sort -u | head -40 || true
          echo ""
          echo "== API / fetch endpoints referenced in dashboard page =="
          curl -sS https://unveiled.pro/dashboard/ | grep -oE 'https?://[a-zA-Z0-9./_-]+' | sort -u | head -60 || true
          echo ""
          echo "== fetch() / API constants inside inline scripts =="
          curl -sS https://unveiled.pro/dashboard/ | grep -oE "(fetch\(|API[_A-Z]*\s*=|onrender[a-z.-]*|supabase[a-zA-Z0-9.-]*|firebase[a-zA-Z0-9.-]*)[^,;)]{0,120}" | head -60 || true
          echo ""
          echo "== Common data files on the site =="
          for p in leads.json data/leads.json sites.json data.json config.json app/config.json dashboard/config.json; do
            curl -sS -o /dev/null -w "https://unveiled.pro/$p -> HTTP %{http_code}\n" "https://unveiled.pro/$p" || true
          done
