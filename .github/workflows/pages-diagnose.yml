name: Pages Diagnose

on:
  workflow_dispatch:
  push:
    branches:
      - claude/code-review-1zskrw
    paths:
      - .github/workflows/pages-diagnose.yml

permissions:
  pages: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Map published pages on unveiled.pro
        run: |
          echo "== robots.txt =="
          curl -sS -w "\n(HTTP %{http_code})\n" https://unveiled.pro/robots.txt | head -30 || true
          echo "== sitemap.xml =="
          curl -sS -w "\n(HTTP %{http_code})\n" https://unveiled.pro/sitemap.xml | head -60 || true
          echo "== path probes =="
          for p in clients preview p site s demos previews clients/index.html thanks begin start onboarding intake; do
            curl -sS -o /dev/null -w "https://unveiled.pro/$p -> HTTP %{http_code}\n" -L "https://unveiled.pro/$p" || true
          done
          echo ""
          echo "== links inside the root page (nav/CTAs may point at app pages) =="
          curl -sS https://unveiled.pro/ | grep -oE 'href="[^"]*"' | grep -v -E "fonts|#|mailto" | sort -u | head -30 || true
          echo ""
          echo "== links inside /app/ =="
          curl -sS https://unveiled.pro/app/ | grep -oE '(href|action|src)="[^"]*"' | grep -v -E "fonts|#|mailto" | sort -u | head -30 || true
