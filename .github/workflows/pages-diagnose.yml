name: Pages Diagnose

on:
  workflow_dispatch:
  push:
    branches:
      - claude/code-review-1zskrw
    paths:
      - .github/workflows/pages-diagnose.yml

permissions:
  pages: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query leads and their preview URLs
        run: |
          HTML=$(curl -sS https://unveiled.pro/dashboard/)
          SB_URL=$(echo "$HTML" | grep -oE "https://[a-z0-9]+\.supabase\.co" | head -1)
          SB_KEY=$(echo "$HTML" | grep -oE "eyJ[A-Za-z0-9_.-]+" | head -1)
          echo "Supabase URL: $SB_URL"
          echo "Anon key present: $([ -n "$SB_KEY" ] && echo yes || echo no)"
          echo ""
          echo "== Recent leads (name, slug, status, preview_url) =="
          curl -sS "$SB_URL/rest/v1/leads?select=*&order=created_at.desc&limit=5" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" | python3 -m json.tool | head -220 || true
          echo ""
          echo "== Recent revisions =="
          curl -sS "$SB_URL/rest/v1/revisions?select=*&order=created_at.desc&limit=5" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" | python3 -m json.tool | head -80 || true
